<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 8 8" shape-rendering="crispEdges">
  <!-- The same 8x8 mark as BrandMark in layout.tsx: ember above, ice below. The dark
       plate is here and not in the header, because a tab icon has to hold its own
       against whatever chrome the browser puts behind it. -->
  <rect width="8" height="8" rx="1.5" fill="#12121c" />
  <rect x="2" y="1" width="1" height="1" fill="#ef7d57" />
  <rect x="3" y="1" width="1" height="1" fill="#ef7d57" />
  <rect x="4" y="1" width="1" height="1" fill="#ef7d57" />
  <rect x="5" y="1" width="1" height="1" fill="#ef7d57" />
  <rect x="1" y="2" width="1" height="1" fill="#ef7d57" />
  <rect x="6" y="2" width="1" height="1" fill="#ef7d57" />
  <rect x="1" y="3" width="1" height="1" fill="#ef7d57" />
  <rect x="3" y="3" width="1" height="1" fill="#ef7d57" />
  <rect x="4" y="3" width="1" height="1" fill="#ef7d57" />
  <rect x="6" y="3" width="1" height="1" fill="#ef7d57" />
  <rect x="1" y="4" width="1" height="1" fill="#67d7ff" />
  <rect x="6" y="4" width="1" height="1" fill="#67d7ff" />
  <rect x="1" y="5" width="1" height="1" fill="#67d7ff" />
  <rect x="2" y="5" width="1" height="1" fill="#67d7ff" />
  <rect x="5" y="5" width="1" height="1" fill="#67d7ff" />
  <rect x="6" y="5" width="1" height="1" fill="#67d7ff" />
  <rect x="2" y="6" width="1" height="1" fill="#67d7ff" />
  <rect x="3" y="6" width="1" height="1" fill="#67d7ff" />
  <rect x="4" y="6" width="1" height="1" fill="#67d7ff" />
  <rect x="5" y="6" width="1" height="1" fill="#67d7ff" />
</svg>
